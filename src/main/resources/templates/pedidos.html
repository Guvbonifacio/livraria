<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>
<div th:replace="~{fragmentos/layout :: chatbot}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragmentos/layout :: menu}"></div>

    <main class="container my-4">
        <h1 class="mb-4">Meus Pedidos</h1>

        <section class="mb-4"
         th:if="${notificacoes != null
                  and !#lists.isEmpty(notificacoes)}">

    <h2 class="h5">Notificações</h2>

    <div class="alert alert-info mb-2"
         th:each="notificacao : ${notificacoes}"
         data-cy="notificacao">

        <small class="d-block text-muted"
               th:text="${#temporals.format(
                   notificacao.dataHora,
                   'dd/MM/yyyy HH:mm'
               )}">
        </small>

        <span th:text="${notificacao.mensagem}"></span>
    </div>
</section>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Data</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id}">1001</td>
                    <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}">20/08/2026</td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}">R$ 151,80</td>
                    <td th:text="${pedido.status}">EM PROCESSAMENTO</td>
                    <td>
                        <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-primary btn-sm">Ver detalhes</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
