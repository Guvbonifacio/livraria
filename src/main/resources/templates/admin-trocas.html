<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav th:replace="~{fragmentos/layout :: menu}"></nav>

    <main class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Trocas</h1>
            <span class="badge bg-warning text-dark">Administração</span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Solicitação</th>
                                <th>Pedido</th>
                                <th>Cliente</th>
                                <th>Data</th>
                                <th>Motivo</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="troca : ${trocas}">
                                <td th:text="${troca.id}">1</td>
                                <td th:text="${troca.pedido.id}">1001</td>
                                <td th:text="${troca.pedido.cliente.nome}">Ana Maria</td>
                                <td th:text="${#temporals.format(troca.dataSolicitacao, 'dd/MM/yyyy')}">27/08/2026</td>
                                <td th:text="${troca.motivo}">Produto danificado</td>
                                <td th:switch="${troca.status}">
                                    <span th:case="'TROCA SOLICITADA'" class="badge bg-warning text-dark">Troca solicitada</span>
                                    <span th:case="'TROCA ACEITA'" class="badge bg-primary">Troca aceita</span>
                                    <span th:case="'TROCA NEGADA'" class="badge bg-danger">Troca negada</span>
                                    <span th:case="'ITEM ENVIADO'" class="badge bg-info text-dark">Item enviado</span>
                                    <span th:case="'ITEM RECEBIDO'" class="badge bg-secondary">Item recebido</span>
                                    <span th:case="'TROCA PROCESSADA'" class="badge bg-success">Troca processada</span>
                                    <span th:case="*" class="badge bg-light text-dark" th:text="${troca.status}">Outro</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/trocas/{id}(id=${troca.id})}" class="btn btn-outline-primary btn-sm">
                                        Ver detalhes
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>
    <div th:replace="~{fragmentos/layout :: scripts}"></div>

</body>
</html>
