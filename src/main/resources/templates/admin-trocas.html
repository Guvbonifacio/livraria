<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav th:replace="~{fragmentos/layout :: menu}"></nav>

    <main class="container my-5">

        <!-- CABEÇALHO DA PÁGINA -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Trocas</h1>
            <span class="badge bg-warning text-dark">Administração</span>
        </div>

        <!-- TABELA DE TROCAS -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Solicitação</th>
                                <th>Pedido</th>
                                <th>Cliente</th>
                                <th>Data</th>
                                <th>Motivo</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="troca : ${trocas}">
                                <td th:text="${troca.id}">1</td>
                                <td th:text="${troca.pedido.id}">1001</td>
                                <td th:text="${troca.pedido.cliente.nome}">Ana Maria</td>
                                <td th:text="${#temporals.format(troca.dataSolicitacao, 'dd/MM/yyyy')}">27/08/2026</td>
                                <td th:text="${troca.motivo}">Produto danificado</td>

                                <td th:switch="${troca.status}">
                                    <span th:case="'EM TROCA'" class="badge bg-warning text-dark">Em troca</span>
                                    <span th:case="'TROCA AUTORIZADA'" class="badge bg-primary">Troca autorizada</span>
                                    <span th:case="'TROCADO'" class="badge bg-success">Trocado</span>
                                    <span th:case="*" class="badge bg-secondary" th:text="${troca.status}">Status</span>
                                </td>

                                <td>
                                    <a th:href="@{/admin/trocas/{id}(id=${troca.id})}" class="btn btn-outline-primary btn-sm">
                                        Ver detalhes
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(trocas)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    Nenhuma solicitação de troca encontrada.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
