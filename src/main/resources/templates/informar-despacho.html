<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragmentos/layout :: menu}"></div>

    <main class="container mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>
                Informar despacho — Pedido #
                <span th:text="${pedidoId}">1001</span>
            </h1>

            <a th:href="@{/pedidos/{id}(id=${pedidoId})}"
               class="btn btn-outline-secondary">
                Voltar
            </a>

        </div>


        <div class="card shadow-sm">

            <div class="card-body">

                <div class="alert alert-info">

                    Após enviar o item para devolução, informe os dados do despacho abaixo.

                </div>


                <div class="mb-3">

                    <label for="transportadora" class="form-label">
                        Transportadora
                    </label>

                    <input type="text"
                           id="transportadora"
                           class="form-control"
                           placeholder="Ex.: Correios">

                </div>


                <div class="mb-3">

                    <label for="codigoRastreio" class="form-label">
                        Código de rastreio
                    </label>

                    <input type="text"
                           id="codigoRastreio"
                           class="form-control"
                           placeholder="Ex.: BR123456789BR">

                </div>


                <div class="mb-3">

                    <label for="dataEnvio" class="form-label">
                        Data do envio
                    </label>

                    <input type="date"
                           id="dataEnvio"
                           class="form-control">

                </div>


                <div class="mb-4">

                    <strong>Status após confirmação:</strong>

                    <span class="badge bg-primary">
                        ITEM ENVIADO
                    </span>

                </div>


                <a th:href="@{/pedidos/{id}(id=${pedidoId})}"
                   class="btn btn-success">
                    Confirmar despacho
                </a>

            </div>

        </div>

    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>

</html>
