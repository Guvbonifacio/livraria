<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>
<div th:replace="~{fragmentos/layout :: chatbot}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragmentos/layout :: menu}"></div>

    <main class="container my-4 mb-5">

        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Solicitar troca — Pedido #<span th:text="${pedido.id}">1001</span></h1>
            <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-outline-secondary">Voltar</a>
        </div>

        <form th:action="@{/pedidos/{id}/troca/despacho(id=${pedido.id})}" method="post">

            <!-- Seleção de Itens -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="h4 mb-3">Selecione os itens para troca</h2>

                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width: 50px;" class="text-center">Trocar</th>
                                    <th>Livro</th>
                                    <th class="text-center">Qtd. Comprada</th>
                                    <th style="width: 110px;" class="text-center">Qtd. Troca</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item, iter : ${pedido.itens}">
                                    <td class="text-center">
                                        <input class="form-check-input" type="checkbox" th:id="|item-${iter.index}|" th:name="|itens[${iter.index}].selecionado|">
                                    </td>
                                    <td th:text="${item.livro.titulo}">O Hobbit</td>
                                    <td class="text-center" th:text="${item.quantidade}">2</td>
                                    <td>
                                        <input type="number" 
                                               class="form-control form-control-sm text-center mx-auto" 
                                               style="width: 65px;" 
                                               min="1" 
                                               th:max="${item.quantidade}" 
                                               value="1"
                                               th:name="|itens[${iter.index}].quantidadeTroca|">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Motivo e Observações -->
            <div class="card shadow-sm mb-2">
                <div class="card-body">
                    <h2 class="h4 mb-3">Motivo da troca</h2>

                    <div class="mb-2">
                        <label for="motivo" class="form-label">Motivo principal *</label>
                        <select id="motivo" name="motivo" class="form-select" required>
                            <option value="" selected disabled>Selecione o motivo da troca</option>
                            <option value="DEFEITO">Produto com defeito de fabricação</option>
                            <option value="DANIFICADO">Produto danificado no transporte</option>
                            <option value="INCORRETO">Item diferente do solicitado</option>
                            <option value="ARREPENDIMENTO">Arrependimento / Desistência</option>
                            <option value="OUTRO">Outro motivo</option>
                        </select>
                    </div>

                    <div class="mb-0">
                        <label for="observacao" class="form-label">Detalhes adicionais (opcional)</label>
                        <textarea id="observacao" 
                                  name="observacao" 
                                  class="form-control" 
                                  rows="3" 
                                  placeholder="Descreva os detalhes referente ao problema encontrado (ex: página rasgada, capa amassada...)"></textarea>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Confirmar solicitação de troca</button>
            </div>

        </form>

    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
