<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragmentos/layout :: chatbot}"></div>
<div th:replace="~{fragmentos/layout :: menu}"></div>

<main class="container my-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            Solicitar troca — Pedido #
            <span th:text="${pedido.id}"></span>
        </h1>

        <a th:href="@{/pedidos/{id}(id=${pedido.id})}"
           class="btn btn-outline-secondary">
            Voltar
        </a>
    </div>

    <div class="alert alert-danger"
         role="alert"
         th:if="${errosTroca != null}">
        <ul class="mb-0">
            <li th:each="erro : ${errosTroca}"
                th:text="${erro}"></li>
        </ul>
    </div>

    <form th:action="@{/pedidos/{id}/troca(id=${pedido.id})}"
          method="post">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Selecione os itens para troca</h2>

                <div class="table-responsive">
                    <table class="table table-striped align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th class="text-center">Trocar</th>
                            <th>Livro</th>
                            <th class="text-center">Qtd. comprada</th>
                            <th class="text-center">Qtd. troca</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="item : ${pedido.itens}"
                            th:attr="data-item-id=${item.id}">

                            <td class="text-center">
                                <input type="checkbox"
                                       class="form-check-input"
                                       name="itensIds"
                                       th:value="${item.id}"
                                       th:disabled="${#lists.contains(itensSolicitados, item.id)}"
                                       data-cy="selecionar-item-troca">
                            </td>

                            <td>
                                <span th:text="${item.livro.titulo}"></span>

                                <span class="badge bg-secondary ms-2"
                                      th:if="${#lists.contains(itensSolicitados, item.id)}">
                                    Troca já solicitada
                                </span>
                            </td>

                            <td class="text-center"
                                th:text="${item.quantidade}">
                            </td>

                            <td>
                                <input type="number"
                                       class="form-control form-control-sm text-center mx-auto"
                                       style="width: 80px;"
                                       min="1"
                                       th:max="${item.quantidade}"
                                       value="1"
                                       th:name="|quantidades[${item.id}]|"
                                       th:disabled="${#lists.contains(itensSolicitados, item.id)}"
                                       data-cy="quantidade-troca">
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Motivo e observações</h2>

                <div class="mb-3">
                    <label for="motivo" class="form-label">
                        Motivo principal (opcional)
                    </label>

                    <select id="motivo"
                            name="motivo"
                            class="form-select">
                        <option value="">Não informar</option>
                        <option value="DEFEITO">
                            Produto com defeito de fabricação
                        </option>
                        <option value="DANIFICADO">
                            Produto danificado no transporte
                        </option>
                        <option value="INCORRETO">
                            Item diferente do solicitado
                        </option>
                        <option value="ARREPENDIMENTO">
                            Arrependimento / Desistência
                        </option>
                        <option value="OUTRO">Outro motivo</option>
                    </select>
                </div>

                <div>
                    <label for="observacao" class="form-label">
                        Detalhes adicionais (opcional)
                    </label>

                    <textarea id="observacao"
                              name="observacao"
                              class="form-control"
                              rows="3"></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/pedidos/{id}(id=${pedido.id})}"
               class="btn btn-secondary">
                Cancelar
            </a>

            <button type="submit"
                    class="btn btn-primary"
                    data-cy="confirmar-troca">
                Confirmar solicitação de troca
            </button>
        </div>
    </form>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
