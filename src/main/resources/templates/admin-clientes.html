<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav th:replace="~{fragmentos/layout :: menu}"></nav>

    <main class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Clientes</h1>
            <span class="badge bg-warning text-dark">Administração</span>
        </div>

        <!-- Filtros -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Filtros</h2>
                <form th:action="@{/admin/clientes}" method="GET">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" name="nome" th:value="${param.nome}" class="form-control" placeholder="Nome do cliente">
                        </div>

                        <div class="col-md-4">
                            <label for="cpf" class="form-label">CPF</label>
                            <input type="text" id="cpf" name="cpf" th:value="${param.cpf}" class="form-control" placeholder="000.000.000-00">
                        </div>

                        <div class="col-md-4">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" name="email" th:value="${param.email}" class="form-control" placeholder="cliente@email.com">
                        </div>

                        <div class="col-md-4">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="text" id="telefone" name="telefone" th:value="${param.telefone}" class="form-control" placeholder="(11) 99999-9999">
                        </div>

                        <div class="col-md-4">
                            <label for="genero" class="form-label">Gênero</label>
                            <select id="genero" name="genero" class="form-select">
                                <option value="">Todos</option>
                                <option value="Feminino" th:selected="${param.genero == 'Feminino'}">Feminino</option>
                                <option value="Masculino" th:selected="${param.genero == 'Masculino'}">Masculino</option>
                                <option value="Outro" th:selected="${param.genero == 'Outro'}">Outro</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="dataNascimento" class="form-label">Data de nascimento</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" th:value="${param.dataNascimento}" class="form-control">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary me-2">Filtrar</button>
                        <a th:href="@{/admin/clientes}" class="btn btn-outline-secondary">Limpar filtros</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabela -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Gênero</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.id}">1</td>
                                <td th:text="${cliente.nome}">Ana Maria</td>
                                <td th:text="${cliente.cpf}">123.456.789-00</td>
                                <td th:text="${cliente.email}">anamaria@email.com</td>
                                <td th:text="${cliente.telefone}">(11) 98765-4321</td>
                                <td th:text="${cliente.genero}">Feminino</td>
                                <td>
                                    <a th:href="@{/admin/clientes/{id}(id=${cliente.id})}" class="btn btn-outline-primary btn-sm">
                                        Ver detalhes
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragmentos/layout :: chatbot}"></div>
    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>
    <div th:replace="~{fragmentos/layout :: scripts}"></div>

</body>
</html>
