<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{fragmentos/layout :: menu}"></nav>

<div class="container">

    <h1 class="mb-4">Catálogo de Livros</h1>

    <!-- Busca e filtro. Ainda em protótipo não filtram nada. -->
    <form class="row g-2 mb-4">
        <div class="col-md-8">
            <input type="text" class="form-control" placeholder="Buscar por título, autor ou ISBN">
        </div>
        <div class="col-md-2">
            <select class="form-select">
                <option>Todas as categorias</option>
                <!--<option>Autoajuda</option> 
                <option>Fantasia</option>
                <option>Ficção</option>
                <option>Literatura Clássica</option>
                <option>Teste última linha</option> -->
                <option th:each="categoria : ${categorias}" th:text="${categoria}">Categoria</option>
                
            </select>
        </div>
        <div class="col-md-2">
            <button type="button" class="btn btn-primary w-100">Buscar</button>
        </div>
    </form>

    <!-- Recomendações do chatbot (RNF0044 -uso de IA generativa.) -->
    <div class="alert alert-info">
        <strong>✨ Recomendados para você:</strong>
        Com base nas suas compras de Fantasia, você pode gostar de
        <em>O Senhor dos Anéis</em> e <em>Duna</em>.
    </div>

    <!-- Um cartão por livro -->
    <div class="row row-cols-2">
        <div class="col-md-3 mb-3" th:each="livro : ${livros}">
            <div class="card h-100">
                <div class="bg-secondary text-white d-flex align-items-center justify-content-center"
                    style="height: 180px;">
                    Capa
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${livro.titulo}">Título</h5>
                    <p class="card-text text-muted mb-1" th:text="${livro.autor}">Autor</p>
                    <span class="badge bg-light text-dark mb-2 align-self-start"
                          th:text="${livro.categoria}">Categoria</span>
                    <p class="h5 text-success"
                       th:text="'R$ ' + ${#numbers.formatDecimal(livro.preco, 1, 'POINT', 2, 'COMMA')}"> <!-- altera o formato de 
                       exibicao padrao. Colora cifrão e virgula no lugar do ponto. RNF 0044 -->
                        R$ 0,00
                    </p>
                    <a class="btn btn-outline-primary mt-auto"
                       th:href="@{/livro/{id}(id=${livro.id})}">Ver detalhes</a> <!-- Cria URL a partir do id do livro -->
                </div>
            </div>
        </div>
    </div>

</div>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
