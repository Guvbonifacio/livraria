<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav th:replace="~{fragmentos/layout :: menu}"></nav>

    <main class="container my-5 flex-grow-1">

        <!-- CABEÇALHO DA PÁGINA -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Pedidos</h1>
            <span class="badge bg-warning text-dark">Administração</span>
        </div>

        <!-- FILTROS DE PESQUISA -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Filtros</h2>

                <form th:action="@{/admin/pedidos}" method="GET">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" name="status" class="form-select">
                                <option value="">Todos</option>
                                <option value="EM PROCESSAMENTO" th:selected="${param.status != null and param.status[0] == 'EM PROCESSAMENTO'}">EM PROCESSAMENTO</option>
                                <option value="APROVADA" th:selected="${param.status != null and param.status[0] == 'APROVADA'}">APROVADA</option>
                                <option value="REPROVADA" th:selected="${param.status != null and param.status[0] == 'REPROVADA'}">REPROVADA</option>
                                <option value="EM TRANSPORTE" th:selected="${param.status != null and param.status[0] == 'EM TRANSPORTE'}">EM TRANSPORTE</option>
                                <option value="ENTREGUE" th:selected="${param.status != null and param.status[0] == 'ENTREGUE'}">ENTREGUE</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="dataInicial" class="form-label">Data inicial</label>
                            <input type="date" id="dataInicial" name="dataInicial" th:value="${param.dataInicial}" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label for="dataFinal" class="form-label">Data final</label>
                            <input type="date" id="dataFinal" name="dataFinal" th:value="${param.dataFinal}" class="form-control">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary me-2">Filtrar</button>
                        <a th:href="@{/admin/pedidos}" class="btn btn-outline-secondary">Limpar filtros</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- TABELA DE PEDIDOS -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Número</th>
                                <th>Cliente</th>
                                <th>Data</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="pedido : ${pedidos}">
                                <td th:text="${pedido.id}">1001</td>
                                <td th:text="${pedido.cliente.nome}">Ana Maria</td>
                                <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}">20/08/2026</td>
                                <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}">R$ 171,80</td>

                                <td th:switch="${pedido.status}">
                                    <span th:case="'EM PROCESSAMENTO'" class="badge bg-warning text-dark">Em processamento</span>
                                    <span th:case="'APROVADA'" class="badge bg-info text-dark">Aprovada</span>
                                    <span th:case="'REPROVADA'" class="badge bg-danger">Reprovada</span>
                                    <span th:case="'EM TRANSPORTE'" class="badge bg-primary">Em transporte</span>
                                    <span th:case="'ENTREGUE'" class="badge bg-success">Entregue</span>
                                    <span th:case="*" class="badge bg-secondary" th:text="${pedido.status}">Status</span>
                                </td>

                                <td>
                                    <a th:href="@{/admin/pedidos/{id}(id=${pedido.id})}" class="btn btn-outline-primary btn-sm">
                                        Ver detalhes
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
