<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav th:replace="~{fragmentos/layout :: menu}"></nav>

    <main class="container my-5">

        <h1 class="mb-4">Alterar cadastro</h1>

        <!-- MENSAGENS DE ERRO -->
        <div th:if="${erros}" class="alert alert-danger">
            <ul class="mb-0">
                <li th:each="erro : ${erros}" th:text="${erro}"></li>
            </ul>
        </div>

        <!-- FORMULÁRIO DE EDIÇÃO -->
        <form th:action="@{/clientes/{id}/atualizar(id=${cliente.id})}" th:object="${cliente}" method="POST">

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Dados Pessoais</h5>
                </div>

                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" th:field="*{nome}" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Gênero</label>
                            <select class="form-select" th:field="*{genero}">
                                <option value="Feminino">Feminino</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Data de Nascimento</label>
                            <input type="date" class="form-control" th:field="*{dataNascimento}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-control" th:field="*{cpf}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" th:field="*{telefone}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" th:field="*{email}" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BOTÕES DE AÇÃO -->
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a th:href="@{/clientes/{id}(id=${cliente.id})}" class="btn btn-secondary">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    Salvar alterações
                </button>
            </div>

        </form>

    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
