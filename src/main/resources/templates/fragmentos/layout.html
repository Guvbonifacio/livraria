<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabeca">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livraria Estante do Saber</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>

<!-- O d-flex flex-column min-vh-100 faz o body ocupar 100% da altura da tela -->
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Menu Superior -->
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/img/logo.png}" alt="Estante do Saber" height="40"> Livraria Estante do Saber
        </a>
        <div>
            <a class="nav-link d-inline text-white me-3" th:href="@{/}">Catálogo</a>
            <a class="nav-link d-inline text-white me-3" th:href="@{/carrinho}">Carrinho</a>
            <a class="nav-link d-inline text-white me-3" th:href="@{/pedidos}">Meus Pedidos</a>
            <a class="nav-link d-inline text-white me-3" th:href="@{/cupons}">Meus Cupons</a>
            <a class="nav-link d-inline text-white me-3" th:href="@{/clientes/1}">Meu Cadastro</a>
            <a class="nav-link d-inline text-warning me-3" th:href="@{/admin/pedidos}">Administração</a>
            <span class="text-white-50">Olá, Maria Silva</span>
        </div>
    </div>
</nav>

<!-- O mt-auto empurra o rodapé para o final da página -->
<footer th:fragment="rodape" class="bg-primary text-white text-center py-3 mt-auto">
    <div class="container">
        Livraria Estante do Saber — Projeto LES · FATEC Mogi das Cruzes · 2026 · Em desenvolvimento por Gustavo Vinícius Bonifácio
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
