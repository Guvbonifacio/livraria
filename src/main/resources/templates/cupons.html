<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/layout :: cabeca}"></head>
<div th:replace="~{fragmentos/layout :: chatbot}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragmentos/layout :: menu}"></div>

    <main class="container my-4 mb-5">

        <h1 class="mb-4">Meus Cupons</h1>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th>
                                <th>Tipo</th>
                                <th>Valor</th>
                                <th>Validade</th>
                                <th>Situação</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cupom : ${cupons}">
                                <td><strong th:text="${cupom.codigo}">TROCA25</strong></td>
                                <td th:text="${cupom.tipo}">Troca</td>
                                <td th:text="|R$ ${#numbers.formatDecimal(cupom.valor, 1, 'POINT', 2, 'COMMA')}|">R$ 25,00</td>
                                <td th:text="${#temporals.format(cupom.validade, 'dd/MM/yyyy')}">31/12/2026</td>
                                <td>
                                    <span th:if="${cupom.situacao == 'DISPONÍVEL'}" class="badge bg-success">Disponível</span>
                                    <span th:if="${cupom.situacao == 'UTILIZADO'}" class="badge bg-secondary">Utilizado</span>
                                    <span th:if="${cupom.situacao == 'EXPIRADO'}" class="badge bg-danger">Expirado</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragmentos/layout :: rodape}"></footer>

</body>
</html>
