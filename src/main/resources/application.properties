spring.application.name=livraria

spring.thymeleaf.cache=false

spring.datasource.url=jdbc:sqlite:livraria.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.sql.init.mode=always
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Validade definida para o cupom de troca emitido pelo excedente.
livraria.cupom-troca.validade-dias=30

# Sessao apenas por cookie. Sem isto o Tomcat anexa ;jsessionid na URL enquanto
# nao confirma o suporte a cookies, o que expoe o identificador no historico,
# nos logs e no cabecalho Referer.
server.servlet.session.tracking-modes=cookie

# Prazo contado a partir da última adição ao carrinho.
# Deve ser superior a cinco minutos.
livraria.carrinho.reserva-minutos=30

# Intervalo de verificação do agendador.
livraria.carrinho.verificacao-ms=1000
livraria.carrinho.agendamento-ativo=true