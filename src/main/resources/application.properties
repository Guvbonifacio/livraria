spring.application.name=livraria

spring.thymeleaf.cache=false

spring.datasource.url=jdbc:sqlite:livraria.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.sql.init.mode=always
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Validade definida para o cupom de troca emitido pelo excedente.
livraria.cupom-troca.validade-dias=30

# Sessao apenas por cookie. Sem isto o Tomcat anexa ;jsessionid na URL enquanto
# nao confirma o suporte a cookies, o que expoe o identificador no historico,
# nos logs e no cabecalho Referer.
server.servlet.session.tracking-modes=cookie

# Prazo contado a partir da última adição ao carrinho.
# Deve ser superior a cinco minutos.
livraria.carrinho.reserva-minutos=src/main/resources/application.properties

# Integração de IA.
# ANTHROPIC_API_KEY fica somente no ambiente do Windows.
livraria.ia.principal=claude

livraria.ia.claude.modelo=claude-opus-5-5
livraria.ia.claude.timeout-segundos=20

livraria.ia.ollama.url=http://localhost:11434
livraria.ia.ollama.modelo=qwen2.5:7b
livraria.ia.ollama.timeout-segundos=120

livraria.ia.max-tokens=512

# Ativar somente pelo terminal durante a verificação manual.
livraria.ia.diagnostico-inicial=false

# Intervalo de verificação do agendador.
livraria.carrinho.verificacao-ms=1000
livraria.carrinho.agendamento-ativo=true

spring.sql.init.data-locations=classpath:data.sql,classpath:data-treino.sql